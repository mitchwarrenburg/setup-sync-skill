# setup-sync defaults. Every folder is relative to each car folder under iRacing\setups,
# so "/Garage 61 - Eclipse Motorsport" means setups\<car>\Garage 61 - Eclipse Motorsport.
defaults:
  # Folders the current season's setups are copied into, one flat folder per track.
  # --target-dir on the command line replaces this list for one run.
  target-dirs:
    - "/Garage 61 - Rasengrasen Racing"
    - "/Garage 61 - Eclipse Motorsport"

  # After copying, recycle everything outside the target dirs except these car-relative globs.
  # Excluded files/folders are still read as sources. --clean-source enables this for one run;
  # repeat --clean-source-exclude GLOB to replace this list for that run.
  clean-source:
    enabled: true
    exclude:
      - "/Garage 61*"
      - "/P1Doks"
      - "/Track Titan"

  # Move target track-folder setups labelled this many seasons or more before the current one
  # into that track folder's Archive folder (2 at 26S3 archives 26S1 and older). --clean-target
  # enables this for one run; --clean-target-seasons N overrides the count without enabling
  # cleanup on its own. Every track folder also gets Custom and Archive folders; Custom is never
  # touched.
  clean-target:
    enabled: true
    past-season-count: 3
